services:
  db:
    image: postgres:16-alpine
    container_name: hiresync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hiresync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hiresync"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiresync_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/hiresync?sslmode=disable"
      PORT: 3000
      NODE_ENV: production
      CRON_ENABLED: "true"
      ENABLE_MOCK_BOARD: "true"
      SCRAPE_BASE_URL: "http://localhost:3000/mock-board/jobs"
      SCRAPE_API_KEY: "change-me"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  postgres_data:
